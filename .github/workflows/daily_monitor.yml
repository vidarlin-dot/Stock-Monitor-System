name: Daily Stock Monitor

on:
  schedule:
    - cron: '00 23 * * 1-5'
  workflow_dispatch:

jobs:
  daily-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # mcporter (Exa search CLI)
          if ! command -v mcporter &>/dev/null; then
            npm install -g mcporter
          fi

      - name: Set up Exa MCP server config
        run: |
          mkdir -p config
          cat > config/mcporter.json <<EOF
          {
            "mcpServers": {
              "exa": { "baseUrl": "https://mcp.exa.ai/mcp" }
            }
          }
          EOF

      - name: Update Analyst Targets (Daily)
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{secrets.GCP_SERVICE_ACCOUNT_JSON }}
          SHEET_NAME: ${{secrets.SHEET_NAME }}
        run: |
          python src/update_analyst_targets.py

      - name: Run Daily Monitor
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{secrets.GCP_SERVICE_ACCOUNT_JSON }}
          SHEET_NAME: ${{secrets.SHEET_NAME }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          python src/main.py
