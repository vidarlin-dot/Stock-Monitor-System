name: Daily Taiwan Stock Monitor

on:
  schedule:
    - cron: '00 2 * * 1-5'
  workflow_dispatch:

jobs:
  taiwan-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          # mcporter (Exa search CLI) — used by analyst_target_scraper
          npm install -g mcporter

      - name: Set up Exa MCP server config
        run: |
          mkdir -p config
          cat > config/mcporter.json <<EOF
          {
            "mcpServers": {
              "exa": { "baseUrl": "https://mcp.exa.ai/mcp" }
            }
          }
          EOF

      - name: Fetch QFII analyst ratings from cnyes
        run: |
          python src/fetch_cnyes.py

      - name: Scrape latest analyst target prices (exa)
        run: |
          python src/analyst_target_scraper.py 6669 3017 2330 3443 8299 6515 2317 3037 2454 8069
        continue-on-error: true

      - name: Update QFII data in Google Sheet
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          python src/update_qfii_sheet.py

      - name: Sync prices and analyst ratings to Google Sheet
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          python src/update_taiwan_prices.py

      - name: Run Taiwan Stock Focus Report
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{secrets.GCP_SERVICE_ACCOUNT_JSON }}
          SHEET_NAME: ${{secrets.SHEET_NAME }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          python src/daily_taiwan_report.py
