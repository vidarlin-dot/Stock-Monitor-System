name: Daily Taiwan Stock Monitor

on:
  schedule:
    - cron: '"'"'30 1 * * 1-5'"'"'
  workflow_dispatch:

jobs:
  taiwan-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '"'"'3.11'"'"'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Fetch QFII analyst ratings from cnyes
        run: |
          python src/fetch_cnyes.py

      - name: Update QFII data in Google Sheet
        run: |
          printf '"'"'%s'"'"' "$GCP_SERVICE_ACCOUNT_JSON" > /tmp/gcp_key.json
          GCP_SERVICE_ACCOUNT_JSON="$(cat /tmp/gcp_key.json)" python src/update_qfii_sheet.py
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

      - name: Run Taiwan Stock Focus Report
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python src/daily_taiwan_report.py
